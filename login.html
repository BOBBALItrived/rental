<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – HydRooms</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="index.html" style="color:white"><i class="fa-solid fa-house-chimney"></i> HydRooms</a></div>
  <button class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li><li><a href="search.html">Search Rooms</a></li>
  </ul>
</nav>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo"><i class="fa-solid fa-house-chimney"></i> HydRooms</div>
    <div class="role-badge" id="roleBadge">Login</div>
    <h2 id="loginTitle">Welcome Back!</h2>
    <div class="msg" id="msg"></div>
    <form onsubmit="doLogin(event)">
      <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="you@example.com" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter password" required /></div>
      <input type="hidden" id="roleField" value="renter" />
      <button type="submit" class="btn-primary">Login <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
    </form>
    <div class="switch-link">Don't have an account? <a href="#" id="registerLink">Register here</a></div>
    <div class="switch-link" style="margin-top:8px"><a href="index.html">← Back to Home</a></div>
    <div style="margin-top:20px;padding:12px;background:#f8fafc;border-radius:8px;font-size:0.82rem;color:#64748b;border:1px dashed #e2e8f0;">
      <strong>Demo Credentials:</strong><br/>
      🏠 Owner: suresh@demo.com / demo123<br/>
      🔍 Renter: priya@demo.com / demo123
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role') || 'renter';
  document.getElementById('roleField').value = role;
  const badge = document.getElementById('roleBadge');
  if (role === 'owner') { badge.textContent='🏠 Owner Login'; badge.style.background='#fff7ed'; badge.style.color='#d97706'; document.getElementById('loginTitle').textContent='Owner Login'; }
  else { badge.textContent='🔍 Renter Login'; badge.style.background='#eff6ff'; badge.style.color='#2563eb'; }
  document.getElementById('registerLink').href = `register.html?role=${role}`;

  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const selRole  = document.getElementById('roleField').value;
    const user = getUsers().find(u => u.email.toLowerCase()===email && u.password===password && u.role===selRole);
    if (!user) { showMsg('msg','error','Invalid email/password or wrong role.'); return; }
    setSession(user);
    window.location.href = user.role==='owner' ? 'owner-dashboard.html' : 'renter-dashboard.html';
  }
  function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
</script>
</body>
</html>
