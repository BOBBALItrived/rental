<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – HydRooms</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="index.html" style="color:white"><i class="fa-solid fa-house-chimney"></i> HydRooms</a></div>
  <button class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li><li><a href="search.html">Search Rooms</a></li>
  </ul>
</nav>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo"><i class="fa-solid fa-house-chimney"></i> HydRooms</div>
    <div class="role-badge" id="roleBadge">Register</div>
    <h2>Create Account</h2>
    <div class="msg" id="msg"></div>
    <form onsubmit="doRegister(event)">
      <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Your full name" required /></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="you@example.com" required /></div>
      <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required /></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirm" placeholder="Re-enter password" required /></div>
      <input type="hidden" id="roleField" value="renter" />
      <button type="submit" class="btn-primary">Create Account <i class="fa-solid fa-user-plus"></i></button>
    </form>
    <div class="switch-link">Already have an account? <a href="#" id="loginLink">Login here</a></div>
    <div class="switch-link" style="margin-top:8px"><a href="index.html">← Back to Home</a></div>
  </div>
</div>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role') || 'renter';
  document.getElementById('roleField').value = role;
  const badge = document.getElementById('roleBadge');
  if (role==='owner') { badge.textContent='🏠 Register as Owner'; badge.style.background='#fff7ed'; badge.style.color='#d97706'; }
  else { badge.textContent='🔍 Register as Renter'; badge.style.background='#eff6ff'; badge.style.color='#2563eb'; }
  document.getElementById('loginLink').href = `login.html?role=${role}`;

  function doRegister(e) {
    e.preventDefault();
    const name=document.getElementById('name').value.trim();
    const email=document.getElementById('email').value.trim().toLowerCase();
    const phone=document.getElementById('phone').value.trim();
    const password=document.getElementById('password').value;
    const confirm=document.getElementById('confirm').value;
    const selRole=document.getElementById('roleField').value;
    if (password!==confirm) { showMsg('msg','error','Passwords do not match.'); return; }
    if (!/^\d{10}$/.test(phone)) { showMsg('msg','error','Enter a valid 10-digit phone number.'); return; }
    const users=getUsers();
    if (users.find(u=>u.email===email)) { showMsg('msg','error','Email already registered.'); return; }
    const newUser={id:'u'+Date.now(),name,email,phone,password,role:selRole};
    users.push(newUser); saveUsers(users); setSession(newUser);
    showMsg('msg','success','Account created! Redirecting…');
    setTimeout(()=>{ window.location.href = selRole==='owner'?'owner-dashboard.html':'renter-dashboard.html'; },1200);
  }
  function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
</script>
</body>
</html>
