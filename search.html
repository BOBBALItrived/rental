<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Rooms – HydRooms</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="index.html" style="color:white"><i class="fa-solid fa-house-chimney"></i> HydRooms</a></div>
  <button class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="search.html">Search Rooms</a></li>
    <li><a href="login.html?role=renter">Renter Login</a></li>
    <li><a href="login.html?role=owner">Owner Login</a></li>
    <li id="navLogout" style="display:none"><a href="#" onclick="logout()">Logout</a></li>
  </ul>
</nav>

<div class="search-page">
  <h2 style="margin-bottom:20px;">🔍 Search Rooms in Hyderabad</h2>
  <div class="search-filters">
    <div class="filter-group">
      <label>Area</label>
      <select id="fArea" class="area-select" onchange="applyFilters()"><option value="">All Areas</option></select>
    </div>
    <div class="filter-group">
      <label>Room Type</label>
      <select id="fType" onchange="applyFilters()">
        <option value="">All Types</option>
        <option>Single Room</option><option>Double Room</option>
        <option>1 BHK</option><option>2 BHK</option><option>PG / Hostel</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Budget</label>
      <select id="fBudget" onchange="applyFilters()">
        <option value="">Any Budget</option>
        <option value="0-5000">Under ₹5,000</option>
        <option value="5000-10000">₹5,000 – ₹10,000</option>
        <option value="10000-20000">₹10,000 – ₹20,000</option>
        <option value="20000+">Above ₹20,000</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Furnishing</label>
      <select id="fFurnish" onchange="applyFilters()">
        <option value="">Any</option>
        <option>Fully Furnished</option><option>Semi-Furnished</option>
        <option>Furnished</option><option>Unfurnished</option>
      </select>
    </div>
    <div class="filter-group">
      <label>&nbsp;</label>
      <button class="btn-sm" onclick="resetFilters()">Reset</button>
    </div>
  </div>

  <p class="results-info" id="resultInfo">Loading rooms…</p>
  <div class="rooms-grid" id="roomsGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <i class="fa-solid fa-house-circle-xmark"></i>
    <h3>No Rooms Found</h3>
    <p>Try adjusting your filters or search a different area.</p>
  </div>
</div>

<div class="modal-overlay" id="contactModal">
  <div class="modal">
    <button class="modal-close" onclick="closeContact()">✕</button>
    <h3><i class="fa-solid fa-phone" style="color:#2563eb"></i> Owner Contact Info</h3>
    <div id="contactModalBody"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('area'))   document.getElementById('fArea').value   = p.get('area');
    if (p.get('type'))   document.getElementById('fType').value   = p.get('type');
    if (p.get('budget')) document.getElementById('fBudget').value = p.get('budget');
    // wait for populateAreaSelects to run first (DOMContentLoaded order), then set value
    setTimeout(() => {
      if (p.get('area')) document.getElementById('fArea').value = p.get('area');
      applyFilters();
    }, 50);
  });

  function applyFilters() {
    const area    = document.getElementById('fArea').value;
    const type    = document.getElementById('fType').value;
    const budget  = document.getElementById('fBudget').value;
    const furnish = document.getElementById('fFurnish').value;
    let rooms = getRooms().filter(r => r.available);
    if (area)    rooms = rooms.filter(r => r.area === area);
    if (type)    rooms = rooms.filter(r => r.type === type);
    if (furnish) rooms = rooms.filter(r => r.furnishing === furnish);
    if (budget) {
      if (budget === '20000+') rooms = rooms.filter(r => r.price > 20000);
      else { const [lo,hi] = budget.split('-').map(Number); rooms = rooms.filter(r => r.price>=lo && r.price<=hi); }
    }
    const grid = document.getElementById('roomsGrid');
    const info = document.getElementById('resultInfo');
    const empty= document.getElementById('emptyState');
    if (rooms.length === 0) {
      grid.innerHTML = ''; empty.style.display = 'block'; info.textContent = 'No rooms found.';
    } else {
      empty.style.display = 'none';
      info.textContent = `Showing ${rooms.length} room${rooms.length>1?'s':''} in Hyderabad`;
      grid.innerHTML = rooms.map(r => buildRoomCard(r,'renter')).join('');
    }
  }

  function resetFilters() {
    ['fArea','fType','fBudget','fFurnish'].forEach(id => document.getElementById(id).value = '');
    applyFilters();
  }
  function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
</script>
</body>
</html>
